<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Name input screen -->
    <div id="nameScreen" class="screen">
        <h2>Enter Your Name</h2>
        <input type="text" id="username" placeholder="Your Name">
        <button onclick="enterChat()">Join Chat</button>
    </div>

    <!-- Chat screen -->
    <div id="chatScreen" class="screen hidden">
        <div class="chat-container">
            <div class="left-panel" id="incomingMessages">
                <h3>Incoming Messages</h3>
            </div>
            <div class="right-panel" id="sentMessages">
                <h3>Your Messages</h3>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
